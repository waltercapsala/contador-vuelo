<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Cuenta regresiva</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --bg: #07111f;
        --text: #f4f7fb;
        --muted: #8d9bb0;
        --line: rgba(255,255,255,.08);
        --accent: #79b8ff;
        --jelly-a: #ff9ecb;
        --jelly-b: #ff6fb0;
        color-scheme: dark;
    }

    html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
        height: 100%;
        min-height: 100%;
        height: 100dvh;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 50% 15%, rgba(75, 137, 207, .18), transparent 34%),
            radial-gradient(circle at 15% 80%, rgba(63, 103, 154, .12), transparent 30%),
            linear-gradient(145deg, #050c17 0%, #091525 48%, #06101d 100%);
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .001ms !important;
            animation-iteration-count: 1 !important;
        }
    }

    /* Fondo */

    .background {
        position: fixed;
        inset: 0;
        pointer-events: none;
    }

    .glow {
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        filter: blur(100px);
        opacity: .18;
        background: #4e91d1;
        left: 50%;
        top: -300px;
        transform: translateX(-50%);
    }

    .bubble {
        position: absolute;
        border: 1px solid rgba(255,255,255,.08);
        background: rgba(255,255,255,.025);
        border-radius: 50%;
        animation: float 8s ease-in-out infinite;
    }

    .bubble:nth-child(2) { width: 18px; height: 18px; left: 13%; top: 34%; }
    .bubble:nth-child(3) { width: 8px; height: 8px; left: 22%; top: 72%; animation-delay: -3s; }
    .bubble:nth-child(4) { width: 25px; height: 25px; right: 15%; top: 38%; animation-delay: -5s; }
    .bubble:nth-child(5) { width: 11px; height: 11px; right: 25%; bottom: 30%; animation-delay: -2s; }

    @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
    }

    /* Contenedor */

    .page {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 0 6vw 26px;
    }

    /* Cielo: franja superior con el avion */

    .top-sky {
        position: relative;
        height: 44px;
        overflow: hidden;
        margin: 0 -6vw;
        padding: 0 6vw;
        flex-shrink: 0;
        padding-top: env(safe-area-inset-top, 14px);
    }

    .stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

.star {
    position: absolute;
    color: rgba(255,255,255,.85);
    font-size: 18px;
    opacity: 0;
    text-shadow: 0 0 8px rgba(255,255,255,.7);
    animation: starAppear 5s ease-in-out infinite;
}

.star-1 { left: 9%;  top: 13%; animation-delay: 0s;   font-size: 17px; }
.star-2 { left: 22%; top: 25%; animation-delay: 2.1s; font-size: 18px; }
.star-3 { left: 35%; top: 10%; animation-delay: 3.7s; font-size: 13px; }
.star-4 { left: 51%; top: 19%; animation-delay: 1.3s; font-size: 29px; }
.star-5 { left: 67%; top: 9%;  animation-delay: 4.2s; font-size: 21px; }
.star-6 { left: 78%; top: 27%; animation-delay: 2.8s; font-size: 38px; }
.star-7 { left: 88%; top: 14%; animation-delay: .8s;  font-size: 22px; }
.star-8 { left: 58%; top: 31%; animation-delay: 4.8s; font-size: 47px; }

@keyframes starAppear {
    0%, 100% {
        opacity: 0;
        transform: scale(.45) rotate(0deg);
    }

    20% {
        opacity: .15;
        transform: scale(.7) rotate(20deg);
    }

    40% {
        opacity: .9;
        transform: scale(1) rotate(45deg);
    }

    60% {
        opacity: .65;
        transform: scale(.85) rotate(70deg);
    }

    78% {
        opacity: .12;
        transform: scale(.5) rotate(100deg);
    }
}

    .plane-rig { position: absolute; top: calc(env(safe-area-inset-top, 14px) + 6px);
        left: -95px; width: 88px; height: 40px; animation: planeFly 11s linear infinite; z-index: 5; } 
       
        .plane { position: relative; width: 100%; height: 100%; transform-origin: center center; animation: planeBob 2.2s ease-in-out infinite; } 
        .plane svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 4px 7px rgba(55, 125, 190, .22)) drop-shadow(0 8px 18px rgba(91, 164, 239, .16));
}
.plane .nav-light {
    animation: navBlink 1.4s ease-in-out infinite;
}

.plane .nav-light:nth-of-type(2) { animation-delay: -.7s; }

@keyframes navBlink {
    0%, 100% { opacity: 1; }
    50%      { opacity: .15; }
}
            
            .contrail { position: absolute; top: 50%; right: calc(100% - 4px); width: 95px; height: 3px; transform: translateY(-50%); border-radius: 999px; 
                background: linear-gradient( to left, rgba(210, 235, 255, .72), rgba(121, 184, 255, .28), transparent ); filter: blur(.4px); opacity: .8; } 
                
                .contrail::after { content: ""; position: absolute; top: 5px; left: 10px; width: 75%; height: 2px; border-radius: 999px;
                 background: linear-gradient( to left, rgba(255, 255, 255, .32), transparent ); filter: blur(1px); } 
                 
                 @keyframes planeFly { 0% { left: -105px; } 100% { left: calc(100% + 15px); } } 
            @keyframes planeBob { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(-1deg) translateY(-3px); } }
    /* Header */

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        z-index: 15;
        padding-top: 10px;
        flex-shrink: 0;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        letter-spacing: .08em;
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
    }

    .brand-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 18px rgba(121,184,255,.7);
    }

    .flight-time {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: .05em;
    }

    /* Centro */

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        position: relative;
        z-index: 10;
        min-height: 0;
        transition: opacity .25s ease;
    }
    main.hide-clock {
    opacity: 0;
    pointer-events: none;
    }

    .countdown-wrapper {
        width: min(900px, 100%);
    }

    .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .22em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 22px;
    }

    .destination {
        font-size: clamp(24px, 4vw, 46px);
        font-weight: 500;
        letter-spacing: -.035em;
        margin-bottom: 34px;
    }

    .destination span {
        color: var(--muted);
        margin: 0 13px;
        font-weight: 300;
    }

    .countdown {
        display: flex;
        justify-content: center;
        align-items: baseline;
        gap: clamp(9px, 2vw, 22px);
        white-space: nowrap;
    }

    .number {
        font-size: clamp(58px, 10vw, 130px);
        line-height: .9;
        font-weight: 300;
        letter-spacing: -.07em;
        font-variant-numeric: tabular-nums;
    }

    .separator {
        font-size: clamp(36px, 5.5vw, 68px);
        color: rgba(255,255,255,.25);
        font-weight: 200;
    }

    .unit {
        font-size: clamp(9px, 1vw, 12px);
        letter-spacing: .2em;
        color: var(--muted);
        text-transform: uppercase;
        margin-left: -5px;
        margin-right: 4px;
        align-self: flex-end;
        margin-bottom: 8px;
    }

    .date-info {
        margin-top: 27px;
        color: var(--muted);
        font-size: 13px;
    }

    /* Acuario: tortuga y medusas por toda la pantalla */

    .ocean {
    position: fixed;
    inset: 0;
    z-index: 12;
    pointer-events: none;
    overflow: hidden;
}

    .sea-lane {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
    }

    .hint {
        position: fixed;
        left: 50%;
        bottom: max(62px, env(safe-area-inset-bottom, 18px) + 42px);
        transform: translateX(-50%);
        z-index: 20;
        font-size: 10px;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: #8da0b8;
        opacity: .75;
        pointer-events: none;
        transition: opacity .4s ease;
        white-space: nowrap;
    }

    .sea-lane.interacted .hint {
        opacity: 0;
    }

    /* Contador de medusas comidas */
    .jelly-counter {
        position: fixed;
        right: max(18px, env(safe-area-inset-right, 18px));
        bottom: max(18px, env(safe-area-inset-bottom, 18px));
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 13px;
        border: 1px solid rgba(255,158,203,.20);
        border-radius: 999px;
        background: rgba(5, 14, 27,.72);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 8px 30px rgba(0,0,0,.18);
        color: #f6d4e6;
        font-size: 11px;
        letter-spacing: .06em;
        pointer-events: none;
        transition: transform .25s ease, border-color .25s ease;
    }
    .venom-counter {
    position: fixed;
    right: 20px;
    bottom: 58px;
    z-index: 20;
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(20, 28, 20, .75);
    border: 1px solid rgba(128, 139, 45, .55);
    color: #d2d88a;
    font-size: 13px;
    font-weight: 600;
    pointer-events: none;
    backdrop-filter: blur(5px);
}

    .jelly-counter .counter-icon {
        font-size: 16px;
        line-height: 1;
        filter: drop-shadow(0 0 7px rgba(255,111,176,.65));
    }

    .jelly-counter .counter-number {
        min-width: 18px;
        text-align: center;
        font-size: 13px;
        font-weight: 800;
        color: #fff;
        font-variant-numeric: tabular-nums;
    }

    .jelly-counter.pop {
        transform: scale(1.12);
        border-color: rgba(255,158,203,.55);
    }

/* Medusas */
.jelly {
    position: absolute;
    width: clamp(28px, 4.2vw, 42px);
    height: clamp(38px, 5.8vw, 56px);
    z-index: 3;
    animation: jellyFloat 5s ease-in-out infinite;
    transition: opacity .35s ease, transform .35s ease;
    pointer-events: none;
    will-change: transform;
}

.jelly svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.jelly .bell {
    filter: drop-shadow(0 0 7px var(--jelly-glow, rgba(255,111,176,.65)));
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: jellyPulse 2.5s ease-in-out infinite;
}

.jelly .bell-shape {
    fill: var(--jelly-glow, rgba(255,111,176,.65));
    stroke: var(--jelly-glow, rgba(255,111,176,.65));
    stroke-width: 1.2;
    stroke-linejoin: round;
}

.jelly .bell-core  { fill: #fff; fill-opacity: .3; }
.jelly .bell-shine { stroke: #fff; stroke-opacity: .75; stroke-width: 1.6; stroke-linecap: round; }

.jelly .tentacle {
    stroke: var(--jelly-glow, rgba(255,111,176,.65));
    stroke-width: 1.3;
    stroke-linecap: round;
    transform-box: fill-box;
    transform-origin: top center;
    animation: tentacleWave 1.6s ease-in-out infinite;
}

.jelly .tentacle.arm { stroke-width: 2.6; }

.jelly .tentacle:nth-child(2) { animation-delay: -.3s; }
.jelly .tentacle:nth-child(3) { animation-delay: -.6s; }
.jelly .tentacle:nth-child(4) { animation-delay: -.9s; }
.jelly .tentacle:nth-child(5) { animation-delay: -1.2s; }
.jelly .tentacle:nth-child(6) { animation-delay: -1.5s; }

@keyframes tentacleWave {
    0%, 100% { transform: rotate(5deg); }
    50%      { transform: rotate(-5deg); }
}

/* la campana se contrae y se relaja */
@keyframes jellyPulse {
    0%, 100% { transform: scale(1, 1); }
    40%      { transform: scale(1.08, .88); }
}

@keyframes jellyFloat {
    0%, 100% { transform: translate3d(0, 0, 0); }
    50%      { transform: translate3d(7px, -13px, 0); }
}

.jelly.eaten {
    opacity: 0;
    transform: scale(.15);
}

/* detalles extra de la venenosa */
.jelly-venom .bell-core  { fill: #d8de7a; fill-opacity: .4; }
.jelly-venom .bell-shine { stroke-opacity: .4; }
    /* Tortuga infectada */
.turtle-rig.infected .turtle {
    filter:
        sepia(.75)
        saturate(1.7)   
        hue-rotate(35deg)
        brightness(.82);
}

.turtle-rig.infected {
    filter: drop-shadow(0 0 12px rgba(128, 139, 45, .75));
}
    /* Medusa venenosa */
.jelly-venom {
    width: clamp(30px, 4.5vw, 45px);
    height: clamp(40px, 6vw, 59px);
    z-index: 3;
    cursor: pointer;
    pointer-events: auto;
}

.jelly-venom .bell {
    filter: drop-shadow(0 0 8px rgba(118, 126, 48, .75));
}

.jelly-venom .tentacle {
    animation: tentacleWave 1.6s ease-in-out infinite;
    transform-origin: top center;
}

.jelly-venom.eaten {
    opacity: 0;
    transform: scale(.15);
}

.jelly-venom.dead {
    animation: venomDeath .45s ease forwards;
    pointer-events: none;
}

@keyframes venomDeath {
    0% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
    }

    100% {
        opacity: 0;
        transform: scale(.2) rotate(25deg);
    }
}

    .bubble-trail {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(180,220,255,.30);
        animation: riseBubble 4s ease-in infinite;
        pointer-events: none;
    }

    @keyframes riseBubble {
        0%   { transform: translateY(0); opacity: .6; }
        100% { transform: translateY(-90px); opacity: 0; }
    }

    /* =========================
   TIBURÓN
   ========================= */

.shark {
    position: absolute;
    width: clamp(200px, 26vw, 320px);
    height: auto;
    z-index: 4;
    pointer-events: auto;
    cursor: pointer;
    user-select: none;
    touch-action: none;
    transform-origin: center center;
    filter: drop-shadow(0 0 8px rgba(0, 0, 0, .45));
}

.shark svg {
    display: block;
    width: 100%;
    height: auto;
}

.shark .shark-body {
    fill: #62727d;
    stroke: #2f393f;
    stroke-width: 2;
    stroke-linejoin: round;
}

.shark .shark-belly {
    fill: #d3d9dc;
}

.shark .shark-fin {
    fill: #4a5860;
    stroke: #2f393f;
    stroke-width: 2;
    stroke-linejoin: round;
}

.shark .shark-eye {
    fill: #111;
}
.shark-dead-eyes,
.shark-blood {
    display: none;
}

.shark-dead-eyes path {
    stroke: #111;
    stroke-width: 3;
    stroke-linecap: round;
}

.shark-blood circle {
    fill: #b52b2b;
}

.shark-dead .shark-eye {
    display: none;
}

.shark-dead .shark-dead-eyes,
.shark-dead .shark-blood {
    display: block;
}

.shark .shark-mouth {
    stroke: #202428;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
}

.shark .shark-tooth {
    fill: #f4f1df;
}

    /* Tortuga: ahora puede nadar por toda la pantalla */
    .turtle-rig {
        position: absolute;
        left: 0;
        top: 0;
        --base: clamp(80px, 9vw, 115px);
            width: calc(var(--base) * var(--grow, 1));
            height: calc(var(--base) * var(--grow, 1) * 80 / 130);
            transition: width .4s ease, height .4s ease;
        z-index: 4;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: auto;
        touch-action: none;
        will-change: transform;
    }

.shark-dead {
    animation: sharkDeath .9s ease forwards;
    pointer-events: none;
}

@keyframes sharkDeath {
    0% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
    }

    35% {
        opacity: 1;
        transform: scale(1.08) rotate(-5deg);
    }

    100% {
        opacity: 0;
        transform: scale(.2) rotate(20deg);
    }
}

    .turtle-rig.dragging {
        cursor: grabbing;
    }

    .turtle {
        width: 100%;
        height: 100%;
        animation: turtleBob 2.8s ease-in-out infinite;
    }

    .turtle-rig.dragging .turtle,
    .turtle-rig.dragging .flipper-front,
    .turtle-rig.dragging .flipper-back {
        animation-duration: .5s;
    }

    .turtle svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    @keyframes turtleBob {
        0%,100% { transform: translateY(0) rotate(0deg); }
        50%     { transform: translateY(-6px) rotate(-2deg); }
    }

   /* colores */
.turtle .turtle-skin  { fill: #58b3a8; stroke: #245e5c; stroke-width: 1.3; stroke-linejoin: round; }
.turtle .shell-rim    { fill: #2f6b4f; stroke: #173d2f; stroke-width: 1.6; stroke-linejoin: round; }
.turtle .shell        { fill: #4f9e62; stroke: #173d2f; stroke-width: 1; }
.turtle .scute        { fill: #74bb83; stroke: #1f4d33; stroke-width: 1; stroke-linejoin: round; }
.turtle .scute-line   { stroke: #1f4d33; stroke-width: 1; stroke-linecap: round; opacity: .8; }
.turtle .shell-shine  { stroke: #fff; stroke-opacity: .28; stroke-width: 2; stroke-linecap: round; }

/* aletas: cada una rota desde su base */
.flipper-front, .flipper-back { transform-box: fill-box; }
.flipper-front.up   { transform-origin: 0% 100%; --d: 1; }
.flipper-front.down { transform-origin: 0% 0%;   --d: -1; }
.flipper-back.up    { transform-origin: 100% 100%; --d: 1; }
.flipper-back.down  { transform-origin: 100% 0%;   --d: -1; }

.flipper-front { animation: flipFront 1.1s ease-in-out infinite; }
.flipper-back  { animation: flipBack 1.1s ease-in-out infinite -.35s; }

@keyframes flipFront {
    0%, 100% { transform: rotate(calc(14deg * var(--d))); }
    50%      { transform: rotate(calc(-18deg * var(--d))); }
}

@keyframes flipBack {
    0%, 100% { transform: rotate(calc(-10deg * var(--d))); }
    50%      { transform: rotate(calc(16deg * var(--d))); }
}

.turtle-mouth {
    transform-box: view-box;
    transform-origin: 120px 41px;
}

    .turtle-rig.chewing .turtle-mouth {
        animation: chew .5s ease-in-out 2;
    }

    @keyframes chew {
        0%, 100% { transform: scaleY(1); }
        50%      { transform: scaleY(.35); }
    }

    .shark .shark-tail {
    transform-box: view-box;
    transform-origin: 50px 56px;
    animation: shark-swim .7s ease-in-out infinite alternate;
}

@keyframes shark-swim {
    from { transform: rotate(-7deg); }
    to   { transform: rotate(7deg); }
}

.shark-dead .shark-tail {
    animation: none;
}
/* el tiburón mastica a la tortuga */
.shark-chewing {
    animation: sharkChew .3s ease-in-out 6;
}

.shark-chewing .shark-tooth {
    transform-box: fill-box;
    transform-origin: center top;
    animation: toothChomp .3s ease-in-out 6;
}

@keyframes sharkChew {
    0%, 100% { transform: scale(1, 1) rotate(0deg); }
    50%      { transform: scale(1.09, .9) rotate(-4deg); }
}

@keyframes toothChomp {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50%      { transform: translateY(-4px) scaleY(.6); }
}
/* tortuga gigante: brilla dorada */
.turtle-rig.mighty {
    filter: drop-shadow(0 0 14px rgba(255, 214, 90, .75));
}

/* el tiburón es devorado */
.shark-eaten {
    animation: sharkEaten .6s ease-in forwards;
    pointer-events: none;
}

@keyframes sharkEaten {
    0%   { opacity: 1; transform: scale(1) rotate(0deg); }
    100% { opacity: 0; transform: scale(.08) rotate(-25deg); }
}

/* Mensaje cada 10 medusas */
.milestone {
    position: fixed;
    left: 50%;
    top: 24%;
    z-index: 40;
    transform: translateX(-50%) scale(.6);
    opacity: 0;
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid rgba(255,158,203,.45);
    background: rgba(5, 14, 27, .82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 0 30px rgba(255,111,176,.35);
    color: #fff;
    font-size: clamp(16px, 4vw, 26px);
    font-weight: 800;
    letter-spacing: .06em;
    white-space: nowrap;
    pointer-events: none;
}

.milestone.show {
    animation: milestonePop 2.4s ease forwards;
}

@keyframes milestonePop {
    0%   { opacity: 0; transform: translateX(-50%) scale(.6); }
    12%  { opacity: 1; transform: translateX(-50%) scale(1.12); }
    22%  { transform: translateX(-50%) scale(1); }
    80%  { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) scale(.9) translateY(-12px); }
}
/* Peces decorativos */
.fish {
    position: absolute;
    left: 0;
    z-index: 2;              /* debajo de medusas (3) y tortuga (4) */
    width: var(--w, 46px);
    pointer-events: none;
    opacity: .9;
    will-change: transform;
    animation: fishCross var(--dur, 30s) linear var(--delay, 0s) infinite;
}

.fish.rtl { animation-direction: reverse; }

.fish-bob {
    animation: fishBob 3s ease-in-out infinite alternate;
}

.fish svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
    transform: scaleX(var(--dir, 1));   /* -1 = mira a la izquierda */
}

.fish-tail {
    transform-box: fill-box;
    transform-origin: 100% 50%;
    animation: tailWag .45s ease-in-out infinite alternate;
}

@keyframes fishCross {
    from { transform: translateX(-25vw); }
    to   { transform: translateX(125vw); }
}

@keyframes fishBob {
    from { transform: translateY(-6px); }
    to   { transform: translateY(6px); }
}

@keyframes tailWag {
    from { transform: rotate(-12deg); }
    to   { transform: rotate(12deg); }
}

            <path d="M16 22 Q26 9 45 15 Q33 18 28 28 Q20 28 16 22 Z" fill="#0f1c3d"/>
            <ellipse cx="36" cy="27" rx="4" ry="2.4" fill="#ffd23c"/>
            <circle cx="48" cy="17" r="2.4" fill="#fff"/>
            <circle cx="48.6" cy="17" r="1.1" fill="#111"/>
        </svg>`;
    
        // cuántos de cada tipo: [dibujo, cantidad, ancho mínimo, ancho máximo]
        const SMALL = window.innerWidth < 600;
        const GROUPS = [
            [CLOWN, 2, 36, 54],
            [TANG,  1, 42, 62]
        ];
    
        GROUPS.forEach(([svg, count, wMin, wMax]) => {
            for (let i = 0; i < count; i++) {
                const fish = document.createElement("div");
                fish.className = "fish";
    
                const inner = document.createElement("div");
                inner.className = "fish-bob";
                inner.innerHTML = svg;
                fish.appendChild(inner);
    
                const dur = 22 + Math.random() * 22;               // 22 a 44 s por cruce
                const w = (wMin + Math.random() * (wMax - wMin)) * (SMALL ? .75 : 1);
                const rtl = Math.random() < 0.5;
    
                fish.style.setProperty("--w", w + "px");
                fish.style.setProperty("--dur", dur + "s");
                fish.style.setProperty("--delay", (-Math.random() * dur) + "s"); // ya están nadando al cargar
                fish.style.setProperty("--dir", rtl ? -1 : 1);
                fish.style.top = (14 + Math.random() * 72) + "%";
                if (rtl) fish.classList.add("rtl");
    
                inner.style.animationDelay = (-Math.random() * 3) + "s";
                inner.style.animationDuration = (2.4 + Math.random() * 2) + "s";
    
                lane.appendChild(fish);
            }
        });
    })();
    </script>
