<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Cuenta regresiva</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --bg: #07111f;
        --text: #f4f7fb;
        --muted: #8d9bb0;
        --line: rgba(255,255,255,.08);
        --accent: #79b8ff;
        --jelly-a: #ff9ecb;
        --jelly-b: #ff6fb0;
        color-scheme: dark;
    }

    html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
        height: 100%;
        min-height: 100%;
        height: 100dvh;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 50% 15%, rgba(75, 137, 207, .18), transparent 34%),
            radial-gradient(circle at 15% 80%, rgba(63, 103, 154, .12), transparent 30%),
            linear-gradient(145deg, #050c17 0%, #091525 48%, #06101d 100%);
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .001ms !important;
            animation-iteration-count: 1 !important;
        }
    }

    /* Fondo */

    .background {
        position: fixed;
        inset: 0;
        pointer-events: none;
    }

    .glow {
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        filter: blur(100px);
        opacity: .18;
        background: #4e91d1;
        left: 50%;
        top: -300px;
        transform: translateX(-50%);
    }

    .bubble {
        position: absolute;
        border: 1px solid rgba(255,255,255,.08);
        background: rgba(255,255,255,.025);
        border-radius: 50%;
        animation: float 8s ease-in-out infinite;
    }

    .bubble:nth-child(2) { width: 18px; height: 18px; left: 13%; top: 34%; }
    .bubble:nth-child(3) { width: 8px; height: 8px; left: 22%; top: 72%; animation-delay: -3s; }
    .bubble:nth-child(4) { width: 25px; height: 25px; right: 15%; top: 38%; animation-delay: -5s; }
    .bubble:nth-child(5) { width: 11px; height: 11px; right: 25%; bottom: 30%; animation-delay: -2s; }

    @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
    }

    /* Contenedor */

    .page {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 0 6vw 26px;
    }

    /* Cielo: franja superior con el avion */

    .top-sky {
        position: relative;
        height: 44px;
        overflow: hidden;
        margin: 0 -6vw;
        padding: 0 6vw;
        flex-shrink: 0;
        padding-top: env(safe-area-inset-top, 14px);
    }

    .stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

.star {
    position: absolute;
    color: rgba(255,255,255,.85);
    font-size: 18px;
    opacity: 0;
    text-shadow: 0 0 8px rgba(255,255,255,.7);
    animation: starAppear 5s ease-in-out infinite;
}

.star-1 { left: 9%;  top: 13%; animation-delay: 0s;   font-size: 17px; }
.star-2 { left: 22%; top: 25%; animation-delay: 2.1s; font-size: 18px; }
.star-3 { left: 35%; top: 10%; animation-delay: 3.7s; font-size: 13px; }
.star-4 { left: 51%; top: 19%; animation-delay: 1.3s; font-size: 29px; }
.star-5 { left: 67%; top: 9%;  animation-delay: 4.2s; font-size: 21px; }
.star-6 { left: 78%; top: 27%; animation-delay: 2.8s; font-size: 38px; }
.star-7 { left: 88%; top: 14%; animation-delay: .8s;  font-size: 22px; }
.star-8 { left: 58%; top: 31%; animation-delay: 4.8s; font-size: 47px; }

@keyframes starAppear {
    0%, 100% {
        opacity: 0;
        transform: scale(.45) rotate(0deg);
    }

    20% {
        opacity: .15;
        transform: scale(.7) rotate(20deg);
    }

    40% {
        opacity: .9;
        transform: scale(1) rotate(45deg);
    }

    60% {
        opacity: .65;
        transform: scale(.85) rotate(70deg);
    }

    78% {
        opacity: .12;
        transform: scale(.5) rotate(100deg);
    }
}

    .plane-rig { position: absolute; top: calc(env(safe-area-inset-top, 14px) + 6px);
        left: -95px; width: 88px; height: 40px; animation: planeFly 11s linear infinite; z-index: 5; } 
       
        .plane { position: relative; width: 100%; height: 100%; transform-origin: center center; animation: planeBob 2.2s ease-in-out infinite; } 
        plane svg { display: block; width: 100%; height: 100%; 
            overflow: visible; filter: drop-shadow(0 4px 7px rgba(55, 125, 190, .22)) drop-shadow(0 8px 18px rgba(91, 164, 239, .16)); } 
            
            .contrail { position: absolute; top: 50%; right: calc(100% - 4px); width: 95px; height: 3px; transform: translateY(-50%); border-radius: 999px; 
                background: linear-gradient( to left, rgba(210, 235, 255, .72), rgba(121, 184, 255, .28), transparent ); filter: blur(.4px); opacity: .8; } 
                
                .contrail::after { content: ""; position: absolute; top: 5px; left: 10px; width: 75%; height: 2px; border-radius: 999px;
                 background: linear-gradient( to left, rgba(255, 255, 255, .32), transparent ); filter: blur(1px); } 
                 
                 @keyframes planeFly { 0% { left: -105px; } 100% { left: calc(100% + 15px); } } 
            @keyframes planeBob { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(-1deg) translateY(-3px); } }
    /* Header */

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        z-index: 2;
        padding-top: 10px;
        flex-shrink: 0;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        letter-spacing: .08em;
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
    }

    .brand-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 18px rgba(121,184,255,.7);
    }

    .flight-time {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: .05em;
    }

    /* Centro */

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        position: relative;
        z-index: 1;
        min-height: 0;
    }

    .countdown-wrapper {
        width: min(900px, 100%);
    }

    .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .22em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 22px;
    }

    .destination {
        font-size: clamp(24px, 4vw, 46px);
        font-weight: 500;
        letter-spacing: -.035em;
        margin-bottom: 34px;
    }

    .destination span {
        color: var(--muted);
        margin: 0 13px;
        font-weight: 300;
    }

    .countdown {
        display: flex;
        justify-content: center;
        align-items: baseline;
        gap: clamp(9px, 2vw, 22px);
        white-space: nowrap;
    }

    .number {
        font-size: clamp(58px, 10vw, 130px);
        line-height: .9;
        font-weight: 300;
        letter-spacing: -.07em;
        font-variant-numeric: tabular-nums;
    }

    .separator {
        font-size: clamp(36px, 5.5vw, 68px);
        color: rgba(255,255,255,.25);
        font-weight: 200;
    }

    .unit {
        font-size: clamp(9px, 1vw, 12px);
        letter-spacing: .2em;
        color: var(--muted);
        text-transform: uppercase;
        margin-left: -5px;
        margin-right: 4px;
        align-self: flex-end;
        margin-bottom: 8px;
    }

    .date-info {
        margin-top: 27px;
        color: var(--muted);
        font-size: 13px;
    }

    /* Parte inferior: solo mar */

    .ocean {
        position: relative;
        z-index: 2;
        width: 100%;
        margin: 0 -6vw;
        padding: 0 6vw;
        flex-shrink: 0;
    }

    .sea-lane {
        position: relative;
        height: clamp(170px, 30vw, 300px);
        border-top: 1px solid var(--line);
        overflow: hidden;
        touch-action: none;
    }

    .hint {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: #5c6a80;
        opacity: .8;
        pointer-events: none;
        transition: opacity .4s ease;
    }

    .sea-lane.interacted .hint {
        opacity: 0;
    }

    /* medusas */

    .jelly {
        position: absolute;
        bottom: 14px;
        width: clamp(24px, 4vw, 34px);
        height: clamp(32px, 5.2vw, 44px);
        animation: jellyDrift 4.5s ease-in-out infinite;
        transition: opacity .5s ease, transform .5s ease;
    }

    .jelly svg { width: 100%; height: 100%; overflow: visible; }

    .jelly .bell {
        filter: drop-shadow(0 0 6px var(--jelly-glow, rgba(255,111,176,.65)));
    }

    .jelly .tentacle {
        animation: tentacleWave 1.6s ease-in-out infinite;
        transform-origin: top center;
    }

    .jelly .tentacle:nth-child(2) { animation-delay: -.3s; }
    .jelly .tentacle:nth-child(3) { animation-delay: -.6s; }
    .jelly .tentacle:nth-child(4) { animation-delay: -.9s; }

    @keyframes tentacleWave {
        0%,100% { transform: rotate(4deg); }
        50%     { transform: rotate(-4deg); }
    }

    @keyframes jellyDrift {
        0%,100% { transform: translateY(0); }
        50%     { transform: translateY(-8px); }
    }

    .jelly.eaten {
        opacity: 0;
        transform: scale(.2);
    }

    .bubble-trail {
        position: absolute;
        bottom: 10px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(180,220,255,.35);
        animation: riseBubble 3s ease-in infinite;
    }

    @keyframes riseBubble {
        0%   { transform: translateY(0); opacity: .6; }
        100% { transform: translateY(-45px); opacity: 0; }
    }

    /* Tortuga: grande e interactiva */

    .turtle-rig {
        position: absolute;
        bottom: 4px;
        width: clamp(170px, 26vw, 320px);
        height: calc(clamp(170px, 26vw, 320px) * 80 / 130);
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    .turtle-rig.dragging {
        cursor: grabbing;
    }

    .turtle {
        width: 100%;
        height: 100%;
        animation: turtleBob 3s ease-in-out infinite;
    }

    .turtle-rig.dragging .turtle,
    .turtle-rig.dragging .flipper-front,
    .turtle-rig.dragging .flipper-back {
        animation-duration: .5s;
    }

    .turtle svg { width: 100%; height: 100%; overflow: visible; }

    @keyframes turtleBob {
        0%,100% { transform: translateY(0) rotate(0deg); }
        50%     { transform: translateY(-5px) rotate(-2deg); }
    }

    .flipper-front {
        transform-origin: 70px 46px;
        animation: flipFront 1.1s ease-in-out infinite;
    }

    .flipper-back {
        transform-origin: 34px 58px;
        animation: flipBack 1.1s ease-in-out infinite;
    }

    @keyframes flipFront {
        0%,100% { transform: rotate(14deg); }
        50%     { transform: rotate(-18deg); }
    }

    @keyframes flipBack {
        0%,100% { transform: rotate(-10deg); }
        50%     { transform: rotate(16deg); }
    }

    .turtle-mouth {
        transform-origin: 108px 33px;
    }

    .turtle-rig.chewing .turtle-mouth {
        animation: chew .5s ease-in-out 2;
    }

    @keyframes chew {
        0%, 100% { transform: scaleY(1); }
        50%      { transform: scaleY(.35); }
    }

    /* Footer */

    footer {
        display: flex;
        justify-content: center;
        margin-top: 8px;
        color: #536176;
        font-size: 10px;
        letter-spacing: .08em;
        text-transform: uppercase;
        flex-shrink: 0;
    }

    @media (max-width: 600px) {
        .page {
            padding: 0 18px max(14px, env(safe-area-inset-bottom, 14px));
            min-height: 100dvh;
        }

        .top-sky {
            margin: 0 -18px;
            padding: 0 18px;
            height: max(44px, calc(env(safe-area-inset-top, 0px) + 34px));
            padding-top: env(safe-area-inset-top, 0px);
        }

        .plane-rig {
            top: calc(env(safe-area-inset-top, 0px) + 6px);
        }

        .ocean {
            margin: 0 -18px;
            padding: 0 18px;
        }

        header {
            padding-top: 8px;
        }

        .flight-time {
            display: none;
        }

        .brand {
            font-size: 10px;
            gap: 9px;
        }

        main {
            align-items: center;
            padding: 8px 0 4px;
        }

        .eyebrow {
            font-size: 9px;
            letter-spacing: .18em;
            margin-bottom: 15px;
        }

        .destination {
            font-size: clamp(22px, 7vw, 32px);
            margin-bottom: 24px;
            white-space: nowrap;
        }

        .destination span {
            margin: 0 8px;
        }

        .countdown {
            gap: clamp(5px, 2vw, 10px);
            width: 100%;
            justify-content: center;
        }

        .number {
            font-size: clamp(43px, 15vw, 68px);
            letter-spacing: -.065em;
        }

        .separator {
            font-size: clamp(28px, 8vw, 42px);
        }

        .unit {
            font-size: 8px;
            letter-spacing: .1em;
            margin-left: -3px;
            margin-right: 1px;
            margin-bottom: 5px;
        }

        .date-info {
            margin-top: 21px;
            font-size: 11px;
        }

        .sea-lane {
            height: clamp(150px, 29dvh, 220px);
        }

        .hint {
            font-size: 8px;
            top: 8px;
        }

        .turtle-rig {
            width: clamp(145px, 42vw, 220px);
            height: calc(clamp(145px, 42vw, 220px) * 80 / 130);
            bottom: 2px;
        }

        .jelly {
            bottom: 10px;
        }

        footer {
            margin-top: 5px;
            padding-bottom: 2px;
            font-size: 8px;
        }
    }

    @media (max-height: 700px) and (max-width: 600px) {
        .eyebrow { margin-bottom: 10px; }
        .destination { margin-bottom: 17px; }
        .date-info { margin-top: 14px; }
        .sea-lane { height: 145px; }
        .turtle-rig { width: 150px; height: calc(150px * 80 / 130); }
    }
</style>
</head>

<script>
const targetDate = new Date("2027-07-16T18:45:00-03:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
        document.getElementById("days").textContent = "000";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

    document.getElementById("days").textContent = String(days).padStart(3, "0");
    document.getElementById("hours").textContent = String(hours).padStart(2, "0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 60000);

    // --- Tortuga interactiva: arrastrar para comer medusas ---
    (function () {
        const lane = document.getElementById("seaLane");
        const turtle = document.getElementById("turtleRig");
        const hint = document.getElementById("hint");
        const jellies = Array.from(document.querySelectorAll(".jelly"));

        let laneWidth = 0;
        let turtleWidth = 0;
        let x = 0;           // posicion izquierda de la tortuga, en px
        let dir = 1;
        let dragging = false;
        let hasInteracted = false;
        const speed = 26;    // px/seg en modo autonomo
        let lastTs = null;

        function measure() {
            laneWidth = lane.clientWidth;
            turtleWidth = turtle.offsetWidth;
            x = Math.min(x, Math.max(0, laneWidth - turtleWidth));
        }

        function setX(px) {
            x = Math.max(0, Math.min(px, laneWidth - turtleWidth));
            turtle.style.left = x + "px";
            checkCollisions();
        }

        function checkCollisions() {
            const turtleCenter = x + turtleWidth * 0.78; // hocico, cerca del extremo derecho
            jellies.forEach((j) => {
                if (j.classList.contains("eaten") || j.dataset.hidden === "1") return;
                const jRect = j.getBoundingClientRect();
                const laneRect = lane.getBoundingClientRect();
                const jCenter = (jRect.left - laneRect.left) + jRect.width / 2;
                if (Math.abs(turtleCenter - jCenter) < turtleWidth * 0.16) {
                    eat(j);
                }
            });
        }

        function eat(j) {
            j.dataset.hidden = "1";
            j.classList.add("eaten");
            turtle.classList.remove("chewing");
            void turtle.offsetWidth;
            turtle.classList.add("chewing");
            setTimeout(() => { turtle.classList.remove("chewing"); }, 1000);

            const delay = 2800 + Math.random() * 2600;
            setTimeout(() => {
                const margin = 8;
                const newLeftPct = 12 + Math.random() * 70;
                j.style.left = newLeftPct + "%";
                requestAnimationFrame(() => {
                    j.classList.remove("eaten");
                    j.dataset.hidden = "0";
                });
            }, delay);
        }

        function markInteracted() {
            if (hasInteracted) return;
            hasInteracted = true;
            lane.classList.add("interacted");
        }

        function pointerDown(e) {
            dragging = true;
            markInteracted();
            turtle.classList.add("dragging");
            movePointer(e);
            e.preventDefault();
        }

        function movePointer(e) {
            if (!dragging) return;
            const point = e.touches ? e.touches[0] : e;
            const laneRect = lane.getBoundingClientRect();
            const px = point.clientX - laneRect.left - turtleWidth * 0.5;
            setX(px);
        }

        function pointerUp() {
            dragging = false;
            turtle.classList.remove("dragging");
        }

        turtle.addEventListener("mousedown", pointerDown);
        turtle.addEventListener("touchstart", pointerDown, { passive: false });
        window.addEventListener("mousemove", movePointer);
        window.addEventListener("touchmove", movePointer, { passive: false });
        window.addEventListener("mouseup", pointerUp);
        window.addEventListener("touchend", pointerUp);

        function tick(ts) {
            if (lastTs === null) lastTs = ts;
            const dt = (ts - lastTs) / 1000;
            lastTs = ts;

            if (!dragging) {
                const maxX = Math.max(0, laneWidth - turtleWidth);
                x += dir * speed * dt;
                if (x <= 0) { x = 0; dir = 1; }
                if (x >= maxX) { x = maxX; dir = -1; }
                turtle.style.left = x + "px";
                checkCollisions();
            }
            requestAnimationFrame(tick);
        }

        window.addEventListener("resize", measure);
        measure();
        requestAnimationFrame(tick);
    })();
</script>
