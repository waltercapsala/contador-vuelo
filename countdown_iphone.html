<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Cuenta regresiva</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --bg: #07111f;
        --text: #f4f7fb;
        --muted: #8d9bb0;
        --line: rgba(255,255,255,.08);
        --accent: #79b8ff;
        --jelly-a: #ff9ecb;
        --jelly-b: #ff6fb0;
        color-scheme: dark;
    }

    html {
        height: 100%;
        scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
        height: 100%;
        min-height: 100%;
        height: 100dvh;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 50% 15%, rgba(75, 137, 207, .18), transparent 34%),
            radial-gradient(circle at 15% 80%, rgba(63, 103, 154, .12), transparent 30%),
            linear-gradient(145deg, #050c17 0%, #091525 48%, #06101d 100%);
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .001ms !important;
            animation-iteration-count: 1 !important;
        }
    }

    /* Fondo */

    .background {
        position: fixed;
        inset: 0;
        pointer-events: none;
    }

    .glow {
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        filter: blur(100px);
        opacity: .18;
        background: #4e91d1;
        left: 50%;
        top: -300px;
        transform: translateX(-50%);
    }

    .bubble {
        position: absolute;
        border: 1px solid rgba(255,255,255,.08);
        background: rgba(255,255,255,.025);
        border-radius: 50%;
        animation: float 8s ease-in-out infinite;
    }

    .bubble:nth-child(2) { width: 18px; height: 18px; left: 13%; top: 34%; }
    .bubble:nth-child(3) { width: 8px; height: 8px; left: 22%; top: 72%; animation-delay: -3s; }
    .bubble:nth-child(4) { width: 25px; height: 25px; right: 15%; top: 38%; animation-delay: -5s; }
    .bubble:nth-child(5) { width: 11px; height: 11px; right: 25%; bottom: 30%; animation-delay: -2s; }

    @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
    }

    /* Contenedor */

    .page {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 0 6vw 26px;
    }

    /* Cielo: franja superior con el avion */

    .top-sky {
        position: relative;
        height: 44px;
        overflow: hidden;
        margin: 0 -6vw;
        padding: 0 6vw;
        flex-shrink: 0;
        padding-top: env(safe-area-inset-top, 14px);
    }

    .stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

.star {
    position: absolute;
    color: rgba(255,255,255,.85);
    font-size: 18px;
    opacity: 0;
    text-shadow: 0 0 8px rgba(255,255,255,.7);
    animation: starAppear 5s ease-in-out infinite;
}

.star-1 { left: 9%;  top: 13%; animation-delay: 0s;   font-size: 17px; }
.star-2 { left: 22%; top: 25%; animation-delay: 2.1s; font-size: 18px; }
.star-3 { left: 35%; top: 10%; animation-delay: 3.7s; font-size: 13px; }
.star-4 { left: 51%; top: 19%; animation-delay: 1.3s; font-size: 29px; }
.star-5 { left: 67%; top: 9%;  animation-delay: 4.2s; font-size: 21px; }
.star-6 { left: 78%; top: 27%; animation-delay: 2.8s; font-size: 38px; }
.star-7 { left: 88%; top: 14%; animation-delay: .8s;  font-size: 22px; }
.star-8 { left: 58%; top: 31%; animation-delay: 4.8s; font-size: 47px; }

@keyframes starAppear {
    0%, 100% {
        opacity: 0;
        transform: scale(.45) rotate(0deg);
    }

    20% {
        opacity: .15;
        transform: scale(.7) rotate(20deg);
    }

    40% {
        opacity: .9;
        transform: scale(1) rotate(45deg);
    }

    60% {
        opacity: .65;
        transform: scale(.85) rotate(70deg);
    }

    78% {
        opacity: .12;
        transform: scale(.5) rotate(100deg);
    }
}

    .plane-rig { position: absolute; top: calc(env(safe-area-inset-top, 14px) + 6px);
        left: -95px; width: 88px; height: 40px; animation: planeFly 11s linear infinite; z-index: 5; } 
       
        .plane { position: relative; width: 100%; height: 100%; transform-origin: center center; animation: planeBob 2.2s ease-in-out infinite; } 
        plane svg { display: block; width: 100%; height: 100%; 
            overflow: visible; filter: drop-shadow(0 4px 7px rgba(55, 125, 190, .22)) drop-shadow(0 8px 18px rgba(91, 164, 239, .16)); } 
            
            .contrail { position: absolute; top: 50%; right: calc(100% - 4px); width: 95px; height: 3px; transform: translateY(-50%); border-radius: 999px; 
                background: linear-gradient( to left, rgba(210, 235, 255, .72), rgba(121, 184, 255, .28), transparent ); filter: blur(.4px); opacity: .8; } 
                
                .contrail::after { content: ""; position: absolute; top: 5px; left: 10px; width: 75%; height: 2px; border-radius: 999px;
                 background: linear-gradient( to left, rgba(255, 255, 255, .32), transparent ); filter: blur(1px); } 
                 
                 @keyframes planeFly { 0% { left: -105px; } 100% { left: calc(100% + 15px); } } 
            @keyframes planeBob { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(-1deg) translateY(-3px); } }
    /* Header */

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        z-index: 15;
        padding-top: 10px;
        flex-shrink: 0;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        letter-spacing: .08em;
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
    }

    .brand-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 18px rgba(121,184,255,.7);
    }

    .flight-time {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: .05em;
    }

    /* Centro */

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        position: relative;
        z-index: 10;
        min-height: 0;
    }

    .countdown-wrapper {
        width: min(900px, 100%);
    }

    .eyebrow {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .22em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 22px;
    }

    .destination {
        font-size: clamp(24px, 4vw, 46px);
        font-weight: 500;
        letter-spacing: -.035em;
        margin-bottom: 34px;
    }

    .destination span {
        color: var(--muted);
        margin: 0 13px;
        font-weight: 300;
    }

    .countdown {
        display: flex;
        justify-content: center;
        align-items: baseline;
        gap: clamp(9px, 2vw, 22px);
        white-space: nowrap;
    }

    .number {
        font-size: clamp(58px, 10vw, 130px);
        line-height: .9;
        font-weight: 300;
        letter-spacing: -.07em;
        font-variant-numeric: tabular-nums;
    }

    .separator {
        font-size: clamp(36px, 5.5vw, 68px);
        color: rgba(255,255,255,.25);
        font-weight: 200;
    }

    .unit {
        font-size: clamp(9px, 1vw, 12px);
        letter-spacing: .2em;
        color: var(--muted);
        text-transform: uppercase;
        margin-left: -5px;
        margin-right: 4px;
        align-self: flex-end;
        margin-bottom: 8px;
    }

    .date-info {
        margin-top: 27px;
        color: var(--muted);
        font-size: 13px;
    }

    /* Acuario: tortuga y medusas por toda la pantalla */

    .ocean {
    position: fixed;
    inset: 0;
    z-index: 12;
    pointer-events: none;
    overflow: hidden;
}

    .sea-lane {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
    }

    .hint {
        position: fixed;
        left: 50%;
        bottom: max(62px, env(safe-area-inset-bottom, 18px) + 42px);
        transform: translateX(-50%);
        z-index: 20;
        font-size: 10px;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: #8da0b8;
        opacity: .75;
        pointer-events: none;
        transition: opacity .4s ease;
        white-space: nowrap;
    }

    .sea-lane.interacted .hint {
        opacity: 0;
    }

    /* Contador de medusas comidas */
    .jelly-counter {
        position: fixed;
        right: max(18px, env(safe-area-inset-right, 18px));
        bottom: max(18px, env(safe-area-inset-bottom, 18px));
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 13px;
        border: 1px solid rgba(255,158,203,.20);
        border-radius: 999px;
        background: rgba(5, 14, 27,.72);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 8px 30px rgba(0,0,0,.18);
        color: #f6d4e6;
        font-size: 11px;
        letter-spacing: .06em;
        pointer-events: none;
        transition: transform .25s ease, border-color .25s ease;
    }

    .jelly-counter .counter-icon {
        font-size: 16px;
        line-height: 1;
        filter: drop-shadow(0 0 7px rgba(255,111,176,.65));
    }

    .jelly-counter .counter-number {
        min-width: 18px;
        text-align: center;
        font-size: 13px;
        font-weight: 800;
        color: #fff;
        font-variant-numeric: tabular-nums;
    }

    .jelly-counter.pop {
        transform: scale(1.12);
        border-color: rgba(255,158,203,.55);
    }

    /* Medusas */
    .jelly {
        position: absolute;
        width: clamp(28px, 4.2vw, 42px);
        height: clamp(38px, 5.8vw, 56px);
        z-index: 3;
        animation: jellyFloat 5s ease-in-out infinite;
        transition: opacity .35s ease, transform .35s ease;
        pointer-events: none;
        will-change: transform;
    }

    .jelly svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    .jelly .bell {
        filter: drop-shadow(0 0 7px var(--jelly-glow, rgba(255,111,176,.65)));
    }

    .jelly .tentacle {
        animation: tentacleWave 1.6s ease-in-out infinite;
        transform-origin: top center;
    }

    .jelly .tentacle:nth-child(2) { animation-delay: -.3s; }
    .jelly .tentacle:nth-child(3) { animation-delay: -.6s; }
    .jelly .tentacle:nth-child(4) { animation-delay: -.9s; }

    @keyframes tentacleWave {
        0%,100% { transform: rotate(4deg); }
        50%     { transform: rotate(-4deg); }
    }

    @keyframes jellyFloat {
        0%,100% { transform: translate3d(0,0,0); }
        50%     { transform: translate3d(7px,-13px,0); }
    }

    .jelly.eaten {
        opacity: 0;
        transform: scale(.15);
    }

    .bubble-trail {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(180,220,255,.30);
        animation: riseBubble 4s ease-in infinite;
        pointer-events: none;
    }

    @keyframes riseBubble {
        0%   { transform: translateY(0); opacity: .6; }
        100% { transform: translateY(-90px); opacity: 0; }
    }

    /* Tortuga: ahora puede nadar por toda la pantalla */
    .turtle-rig {
        position: absolute;
        left: 0;
        top: 0;
        width: clamp(145px, 19vw, 230px);
        height: calc(clamp(145px, 19vw, 230px) * 80 / 130);
        z-index: 4;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        pointer-events: auto;
        touch-action: none;
        will-change: transform;
    }

    .turtle-rig.dragging {
        cursor: grabbing;
    }

    .turtle {
        width: 100%;
        height: 100%;
        animation: turtleBob 2.8s ease-in-out infinite;
    }

    .turtle-rig.dragging .turtle,
    .turtle-rig.dragging .flipper-front,
    .turtle-rig.dragging .flipper-back {
        animation-duration: .5s;
    }

    .turtle svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    @keyframes turtleBob {
        0%,100% { transform: translateY(0) rotate(0deg); }
        50%     { transform: translateY(-6px) rotate(-2deg); }
    }

    .flipper-front {
        transform-origin: 70px 46px;
        animation: flipFront 1.1s ease-in-out infinite;
    }

    .flipper-back {
        transform-origin: 34px 58px;
        animation: flipBack 1.1s ease-in-out infinite;
    }

    @keyframes flipFront {
        0%,100% { transform: rotate(14deg); }
        50%     { transform: rotate(-18deg); }
    }

    @keyframes flipBack {
        0%,100% { transform: rotate(-10deg); }
        50%     { transform: rotate(16deg); }
    }

    .turtle-mouth {
        transform-origin: 108px 33px;
    }

    .turtle-rig.chewing .turtle-mouth {
        animation: chew .5s ease-in-out 2;
    }

    @keyframes chew {
        0%, 100% { transform: scaleY(1); }
        50%      { transform: scaleY(.35); }
    }
/* Mensaje cada 10 medusas */
.milestone {
    position: fixed;
    left: 50%;
    top: 24%;
    z-index: 40;
    transform: translateX(-50%) scale(.6);
    opacity: 0;
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid rgba(255,158,203,.45);
    background: rgba(5, 14, 27, .82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 0 30px rgba(255,111,176,.35);
    color: #fff;
    font-size: clamp(16px, 4vw, 26px);
    font-weight: 800;
    letter-spacing: .06em;
    white-space: nowrap;
    pointer-events: none;
}

.milestone.show {
    animation: milestonePop 2.4s ease forwards;
}

@keyframes milestonePop {
    0%   { opacity: 0; transform: translateX(-50%) scale(.6); }
    12%  { opacity: 1; transform: translateX(-50%) scale(1.12); }
    22%  { transform: translateX(-50%) scale(1); }
    80%  { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) scale(.9) translateY(-12px); }
}
    /* Footer */

    footer {
        display: flex;
        justify-content: center;
        margin-top: 8px;
        color: #536176;
        font-size: 10px;
        letter-spacing: .08em;
        text-transform: uppercase;
        flex-shrink: 0;
        position: relative;
        z-index: 15;
    }

    @media (max-width: 600px) {
        .page {
            padding: 0 18px max(14px, env(safe-area-inset-bottom, 14px));
            min-height: 100dvh;
        }

        .top-sky {
            margin: 0 -18px;
            padding: 0 18px;
            height: max(44px, calc(env(safe-area-inset-top, 0px) + 34px));
            padding-top: env(safe-area-inset-top, 0px);
        }

        .plane-rig {
            top: calc(env(safe-area-inset-top, 0px) + 6px);
        }

      

        header {
            padding-top: 8px;
        }

        .flight-time {
            display: none;
        }

        .brand {
            font-size: 10px;
            gap: 9px;
        }

        main {
            align-items: center;
            padding: 8px 0 4px;
        }

        .eyebrow {
            font-size: 9px;
            letter-spacing: .18em;
            margin-bottom: 15px;
        }

        .destination {
            font-size: clamp(22px, 7vw, 32px);
            margin-bottom: 24px;
            white-space: nowrap;
        }

        .destination span {
            margin: 0 8px;
        }

        .countdown {
            gap: clamp(5px, 2vw, 10px);
            width: 100%;
            justify-content: center;
        }

        .number {
            font-size: clamp(43px, 15vw, 68px);
            letter-spacing: -.065em;
        }

        .separator {
            font-size: clamp(28px, 8vw, 42px);
        }

        .unit {
            font-size: 8px;
            letter-spacing: .1em;
            margin-left: -3px;
            margin-right: 1px;
            margin-bottom: 5px;
        }

        .date-info {
            margin-top: 21px;
            font-size: 11px;
        }

        .hint {
            font-size: 8px;
            bottom: max(58px, env(safe-area-inset-bottom, 14px) + 40px);
        }

        .turtle-rig {
            width: clamp(130px, 34vw, 190px);
            height: calc(clamp(130px, 34vw, 190px) * 80 / 130);
        }

        .jelly-counter {
            right: max(12px, env(safe-area-inset-right, 12px));
            bottom: max(12px, env(safe-area-inset-bottom, 12px));
            padding: 8px 11px;
        }

        .jelly {
            width: clamp(25px, 8vw, 38px);
            height: clamp(34px, 10vw, 50px);
        }

        footer {
            margin-top: 5px;
            padding-bottom: 2px;
            font-size: 8px;
        }
    }

    @media (max-height: 700px) and (max-width: 600px) {
        .eyebrow { margin-bottom: 10px; }
        .destination { margin-bottom: 17px; }
        .date-info { margin-top: 14px; }
        .turtle-rig { width: 135px; height: calc(135px * 80 / 130); }
        .jelly { width: 27px; height: 38px; }
    }
</style>
</head>

<body>

<div class="background">
    <div class="glow"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
</div>

<div class="page">

    <!-- CIELO: avion cruzando arriba -->
    <div class="top-sky"> <div class="plane-rig"> <div class="contrail"></div> <div class="plane"> <svg viewBox="0 0 180 80" fill="none"> 
        <!-- Fuselaje --> <path d="M10 39 C38 36 73 34 108 34 L151 33 C162 33 170 36 176 40 C170 44 162 47 151 47 L108 46 C73 46 38 44 10 41 C7 41 7 40 10 39Z" 
        fill="rgba(232,242,255,.97)" /> 
        <!-- Ala principal --> <path d="M108 35 L79 8 C76 5 71 6 69 9 L91 36 L91 44 L69 71 C71 74 76 75 79 72 L108 45Z" fill="rgba(180,214,250,.96)" /> 
        <!-- Ala trasera --> <path d="M57 36 L43 20 L37 20 L46 37 L46 43 L37 60 L43 60 L57 44Z" fill="rgba(169,205,244,.94)" /> 
        <!-- Cola  <path d="M42 37 L31 17 L25 18 L31 38 L31 43 L25 62 L31 63 L42 44Z" fill="rgba(158,198,240,.96)" /> --> 
        <!-- Nariz --> <path d="M151 33 C162 33 170 36 176 40 C170 44 162 47 151 47 L158 40Z" fill="rgba(248,251,255,.99)" />
        <!-- Ventanas --> <g fill="rgba(91,137,181,.72)"> <circle cx="91" cy="38.8" r="1.35"/> <circle cx="98" cy="38.7" r="1.35"/>
             <circle cx="105" cy="38.6" r="1.35"/> <circle cx="112" cy="38.5" r="1.35"/> <circle cx="119" cy="38.4" r="1.35"/> 
             <circle cx="126" cy="38.3" r="1.35"/> <circle cx="133" cy="38.2" r="1.35"/> <circle cx="140" cy="38.1" r="1.35"/> </g>

              <!-- Motores --> <ellipse cx="91" cy="29" rx="7" ry="3" fill="rgba(125,166,211,.9)" /> 
              <ellipse cx="91" cy="51" rx="7" ry="3" fill="rgba(125,166,211,.9)" /> 
              <!-- Luz --> <circle cx="160" cy="40" r="1.7" fill="rgba(255,255,255,.98)" /> </svg> </div> </div> </div>

                <!-- ESTRELLAS -->
              <div class="stars" aria-hidden="true">
                <span class="star star-1">✦</span>
                <span class="star star-2">✧</span>
                <span class="star star-3">✦</span>
                <span class="star star-4">✧</span>
                <span class="star star-5">✦</span>
                <span class="star star-6">✧</span>
                <span class="star star-7">✦</span>
                <span class="star star-8">✧</span>
            </div>
    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            <span>Cuenta regresiva</span>
        </div>

        <div class="flight-time">
            España · 23:10
        </div>
    </header>

    <main>
        <section class="countdown-wrapper">

            <div class="eyebrow">
                Hasta el próximo viaje
            </div>

            <div class="destination">
                España
                <span>→</span>
                Buenos Aires
            </div>

            <div class="countdown">
                <div class="number" id="days">000</div>
                <div class="unit">días</div>

                <div class="separator">:</div>

                <div class="number" id="hours">00</div>

                <div class="separator">:</div>

                <div class="number" id="minutes">00</div>
                <div class="unit">min</div>
            </div>

            <div class="date-info">
                16 de julio de 2027 · 23:10
            </div>

        </section>
    </main>

    <!-- ACUARIO: tortuga y medusas por toda la pantalla -->
    <section class="ocean" aria-label="Acuario interactivo">
        <div class="sea-lane" id="seaLane">
            <div class="hint" id="hint">La tortuga nada sola y come medusas</div>

            <div class="jelly-counter" id="jellyCounter" aria-live="polite">
                <span class="counter-icon">
                    <svg viewBox="0 0 40 55" width="16" height="22" fill="none" style="display:block">
                        <ellipse cx="20" cy="16" rx="15" ry="13" fill="#ff9ecb"/>
                        <path d="M9 24 C9 34 13 38 10 47" stroke="#ff9ecb" stroke-width="3" stroke-linecap="round"/>
                        <path d="M16 27 C16 37 19 40 17 51" stroke="#ff9ecb" stroke-width="3" stroke-linecap="round"/>
                        <path d="M24 27 C24 37 21 40 23 51" stroke="#ff9ecb" stroke-width="3" stroke-linecap="round"/>
                        <path d="M31 24 C31 34 27 38 30 47" stroke="#ff9ecb" stroke-width="3" stroke-linecap="round"/>
                    </svg>

<script>
    const targetDate = new Date("2027-07-16T18:45:00-03:00").getTime();
    
    function updateCountdown() {
        const now = new Date().getTime();
        const distance = targetDate - now;
    
        if (distance <= 0) {
            document.getElementById("days").textContent = "000";
            document.getElementById("hours").textContent = "00";
            document.getElementById("minutes").textContent = "00";
            return;
        }
    
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    
        document.getElementById("days").textContent = String(days).padStart(3, "0");
        document.getElementById("hours").textContent = String(hours).padStart(2, "0");
        document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
    }
    
    updateCountdown();
    setInterval(updateCountdown, 60000);
    
    // --- Tortuga: fija, la mueve solo el usuario (mouse o dedo) ---
    (function () {
        const lane = document.getElementById("seaLane");
        const turtle = document.getElementById("turtleRig");
        const counter = document.getElementById("jellyCounter");
        const countEl = document.getElementById("jellyCount");
        const milestone = document.getElementById("milestoneMsg");
        const FRASES = [
    "¡ÑAM DELICIOSO! 😋",
    "¡LAS EXTINGO EN BREVES! 🤤",
    "¡MÁS MEDUSAS POLFAVOL! 🤤",
    "¡TOY HAMBRIENTA! 🐢",
    "¡NI JUANA EN NAVIDAD COME TANTO!",
    "¿NO TE PARECE MUCHO YA?",
    "¿EN SERIO VAS A SEGUIR JUGANDO?",
    "¿SOY TORTUGA O BALLENA?"
];
let fraseIndex = 0;
        const jellies = Array.from(document.querySelectorAll(".jelly"));
    
        const MIN_Y = 70;
        let areaW = 0, areaH = 0;
        let turtleW = 0, turtleH = 0;
        let x = 0, y = 0;
        let placed = false;
        let dragging = false;
        let dragPointerId = null;
        let dragOffsetX = 0, dragOffsetY = 0;
        let lastCollisionCheck = 0;
        let eatenCount = 0;
    
        function measure() {
            areaW = lane.clientWidth;
            areaH = lane.clientHeight;
            turtleW = turtle.offsetWidth;
            turtleH = turtle.offsetHeight;
    
            if (!placed) {
                x = (areaW - turtleW) / 2;
                y = areaH - turtleH - 90;
                placed = true;
            }
    
            x = Math.max(0, Math.min(x, Math.max(0, areaW - turtleW)));
            y = Math.max(MIN_Y, Math.min(y, Math.max(MIN_Y, areaH - turtleH)));
            setPosition();
        }
    
        function setPosition() {
            turtle.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        }
    
        function markInteracted() {
            lane.classList.add("interacted");
        }
    
        function checkCollisions(now) {
            if (now - lastCollisionCheck < 60) return;
            lastCollisionCheck = now;
    
            const laneRect = lane.getBoundingClientRect();
            const mouthX = x + turtleW * .83;
            const mouthY = y + turtleH * .50;
    
            jellies.forEach(j => {
                if (j.classList.contains("eaten") || j.dataset.hidden === "1") return;
    
                const r = j.getBoundingClientRect();
                const cx = r.left - laneRect.left + r.width * .5;
                const cy = r.top - laneRect.top + r.height * .38;
    
                if (Math.hypot(mouthX - cx, mouthY - cy) < Math.max(turtleW * .25, 34)) {
                    eat(j);
                }
            });
        }
        function showMilestone() {
    milestone.textContent = FRASES[fraseIndex % FRASES.length];
    fraseIndex++;

    milestone.classList.remove("show");
    void milestone.offsetWidth;
    milestone.classList.add("show");
}
        function eat(j) {
            j.dataset.hidden = "1";
            j.classList.add("eaten");
    
            eatenCount++;
            countEl.textContent = eatenCount;
            if (eatenCount % 10 === 0) showMilestone();
    
            counter.classList.remove("pop");
            void counter.offsetWidth;
            counter.classList.add("pop");
            setTimeout(() => counter.classList.remove("pop"), 260);
    
            turtle.classList.remove("chewing");
            void turtle.offsetWidth;
            turtle.classList.add("chewing");
            setTimeout(() => turtle.classList.remove("chewing"), 1000);
    
            setTimeout(() => {
                j.style.left = (4 + Math.random() * 92) + "%";
                j.style.top = (10 + Math.random() * 82) + "%";
                requestAnimationFrame(() => {
                    j.classList.remove("eaten");
                    j.dataset.hidden = "0";
                });
            }, 1800 + Math.random() * 3200);
        }
    
        function startDrag(e) {
            if (e.button !== undefined && e.button !== 0) return;
    
            dragging = true;
            dragPointerId = e.pointerId;
    
            const rect = lane.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left - x;
            dragOffsetY = e.clientY - rect.top - y;
    
            turtle.classList.add("dragging");
            markInteracted();
    
            if (turtle.setPointerCapture) {
                try { turtle.setPointerCapture(e.pointerId); } catch (_) {}
            }
            e.preventDefault();
        }
    
        function drag(e) {
            if (!dragging || e.pointerId !== dragPointerId) return;
    
            const rect = lane.getBoundingClientRect();
            const maxX = Math.max(0, areaW - turtleW);
            const maxY = Math.max(MIN_Y, areaH - turtleH);
    
            x = Math.max(0, Math.min(e.clientX - rect.left - dragOffsetX, maxX));
            y = Math.max(MIN_Y, Math.min(e.clientY - rect.top - dragOffsetY, maxY));
    
            setPosition();
            checkCollisions(performance.now());
            e.preventDefault();
        }
    
        function endDrag(e) {
            if (!dragging) return;
            if (e && e.pointerId !== undefined && e.pointerId !== dragPointerId) return;
    
            dragging = false;
            dragPointerId = null;
            turtle.classList.remove("dragging");
        }
    
        turtle.addEventListener("pointerdown", startDrag);
        turtle.addEventListener("pointermove", drag);
        turtle.addEventListener("pointerup", endDrag);
        turtle.addEventListener("pointercancel", endDrag);
        turtle.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
    
        window.addEventListener("resize", measure);
        measure();
    })();
    </script>
